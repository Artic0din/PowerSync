name: Queue automated fixes

on:
  pull_request:
    types: [opened, labeled, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  queue:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automation') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enter the protected Graphite merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label merge-queue
