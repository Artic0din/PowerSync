name: HACS Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  support-intake-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Test deterministic intake
        run: python -m pytest tests/test_support_intake.py -q
      - name: Test browser sanitiser
        run: node --test tests/support_bundle_sanitizer.test.mjs

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # issues: issue tracking is Discord-only by policy; GitHub Issues stay disabled.
          # license: the repo IS licensed (PolyForm Noncommercial 1.0.0, see LICENSE),
          # but GitHub's license detector does not recognize PolyForm, so the HACS
          # check reads SPDX NOASSERTION and can never pass.
          ignore: issues license

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
