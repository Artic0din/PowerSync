name: HACS Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  support-automation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Validate immutable support references
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/commits?per_page=100" \
            > /tmp/support-pull-commits.json
          gh api "/repos/${GITHUB_REPOSITORY}" \
            | jq -e \
              '.allow_squash_merge == true and
               .allow_merge_commit == false and
               .allow_rebase_merge == false and
               .squash_merge_commit_message == "COMMIT_MESSAGES"' >/dev/null
          python -m scripts.prepare_automated_release validate-reference \
            --event "$GITHUB_EVENT_PATH" \
            --pages /tmp/support-pull-commits.json
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Test deterministic intake
        run: >-
          python -m pytest
          tests/test_support_intake.py
          tests/test_support_workflows.py
          -q
      - name: Test support issue transitions
        run: >-
          python -m pytest
          tests/test_support_issue_state.py
          tests/test_support_release_delivery.py
          tests/test_prepare_automated_release.py
          -q
      - name: Test browser sanitiser
        run: node --test tests/support_bundle_sanitizer.test.mjs
      - name: Install pinned agentic workflow compiler
        uses: github/gh-aw/actions/setup-cli@53843da968225dc56e1590978a7ed6407a8438ac
        with:
          version: v0.85.4
      - name: Reject stale compiled agentic workflows
        run: |
          gh aw compile issue-triage issue-investigation feature-assessment
          git diff --exit-code -- .github/workflows/issue-triage.lock.yml \
            .github/workflows/issue-investigation.lock.yml \
            .github/workflows/feature-assessment.lock.yml

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # license: the repo IS licensed (PolyForm Noncommercial 1.0.0, see LICENSE),
          # but GitHub's license detector does not recognize PolyForm, so the HACS
          # check reads SPDX NOASSERTION and can never pass.
          ignore: license

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
