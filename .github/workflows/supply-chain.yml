name: Supply Chain

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deps-audit:
    name: pip-audit (advisory)
    # Skip sync/* PRs: upstream dependency state is advisory, not our gate.
    if: ${{ !startsWith(github.head_ref, 'sync/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      # No root manifest exists; runtime deps are declared in manifest.json.
      - name: Audit declared runtime dependencies against OSV
        run: |
          python3 -c "import json; print('\n'.join(json.load(open('custom_components/power_sync/manifest.json')).get('requirements', [])))" > ps-requirements.txt
          echo "Auditing declared requirements:"; cat ps-requirements.txt
          uvx pip-audit -r ps-requirements.txt \
            || echo "::warning::pip-audit reported advisories — triage; advisory-only until the dependency baseline is clean, then promote to a blocking gate"

  workflows-audit:
    name: zizmor (fork workflows)
    if: ${{ !startsWith(github.head_ref, 'sync/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      # Gate on HIGH severity for the workflows we own. Upstream-owned
      # workflows are intentionally excluded — auditing them would create
      # divergence we cannot merge back. Promote to all workflows once the
      # fork no longer tracks upstream CI 1:1.
      - name: Audit fork-owned workflows (gate on high severity)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx zizmor --min-severity=high --persona=regular \
            .github/workflows/fork-ci.yml \
            .github/workflows/fork-sync-advisory.yml \
            .github/workflows/fork-claude.yml \
            .github/workflows/supply-chain.yml \
            .github/workflows/sbom.yml
