name: Fork Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      !startsWith(github.event.pull_request.head.ref, 'sync/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # persist-credentials kept: claude-code-action performs authenticated
      # git pushes using the checkout-provided token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@db614ad5ed8c94def23ad6cc336751c8ba450ac1  # v1.0.133
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 30"
