name: Sync issues to Plane

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  add-plane-label:
    name: Add Plane label
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add Plane label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit "$ISSUE_URL" --add-label plane
