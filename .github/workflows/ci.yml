name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # GitHub currently reports PolyForm Noncommercial as NOASSERTION.
          # Keep HACS license validation ignored until upstream detection supports it.
          ignore: license
      - name: Hassfest
        if: ${{ always() && !cancelled() }}
        uses: home-assistant/actions/hassfest@master
