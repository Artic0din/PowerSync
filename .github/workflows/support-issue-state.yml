name: Support issue state

on:
  issue_comment:
    types: [created]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to reconcile
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: support-state-${{ github.event.issue.number || github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  transition:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
      github.event.comment.body == '/powersync solved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the state machine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Apply the requested transition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.run_support_issue_state
