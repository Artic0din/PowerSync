name: Support evidence intake

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: support-evidence-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'issue_comment' ||
       github.event.comment.body != '/powersync solved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the intake gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Inspect current issue evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.run_support_intake
